[project]
name = "ai-test-generation-agent"
version = "0.1.0"
description = "LangChain-powered pytest generation agent with codebase retrieval and evaluation harness."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=0.2.0",
    "langchain-groq>=0.3.2",
    "langchain-openai>=0.1.8",
    "openai>=1.30.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "tenacity>=8.2.0",
    "gradio>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
